version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_ops_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: ai_ops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_ops_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: